name: Release

# Tagged builds. Same native-runner constraint as ci.yml: gocv needs cgo, so
# each artifact is built on its own platform. macOS is out of scope.
#
# Binaries ship UNSIGNED. Windows users will see a SmartScreen warning on
# first run; the release notes say so explicitly rather than letting people
# discover it.

on:
  push:
    tags:
      - 'v*'
  # Allows a dry run against a branch: builds and uploads artifacts but
  # publishes no release.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never interrupt a half-finished release build

permissions:
  contents: read

env:
  OPENCV_VERSION: 4.6.0
  WAILS_VERSION: v2.13.0

jobs:
  # A leaked credential must stop a release before any artifact is published.
  # Once a release asset is public it cannot be unpublished meaningfully.
  credential-scan:
    name: Credential scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/check-no-credentials.sh

  linux:
    name: Build Linux (${{ matrix.architecture }})
    needs: credential-scan
    runs-on: ${{ matrix.runner }}
    strategy:
      # One architecture failing should not cancel the other. A release that
      # can ship one of the two is worth knowing about, and both logs are
      # needed to tell an architecture-specific fault from a general one.
      fail-fast: false
      matrix:
        include:
          # Pinned rather than ubuntu-latest so both entries build against the
          # same distribution. There is no ubuntu-latest-arm alias, so leaving
          # this floating would silently split the two architectures onto
          # different Ubuntu releases the moment latest moves on, and the
          # webkit2_41 build tag is specific to 24.04.
          - architecture: amd64
            runner: ubuntu-24.04
          # GitHub's hosted arm64 Linux runners are free for public
          # repositories, which this one is, so arm64 is a native build for the
          # same reason amd64 is: gocv links OpenCV through cgo and will not
          # cross-compile.
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          # Node 20 reached end of life in April 2026. 24 is the current LTS and
          # is what development machines run, so CI and a developer build the
          # same frontend with the same toolchain.
          node-version: '24'

      # imagemagick and lintian are here for the .deb rather than for the build:
      # the icon has to be resampled to a size the hicolor theme indexes, and a
      # package nobody lints is a package whose mistakes reach users.
      # dpkg-deb and dpkg-shlibdeps come from dpkg-dev, which build-essential
      # already pulls in.
      - name: Install OpenCV, GTK/WebKit, and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libopencv-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            imagemagick lintian

      # The same assertion ci.yml makes. It matters more here, because the two
      # architectures draw from different Ubuntu archives and a version skew
      # between them would otherwise surface as a compile error deep inside the
      # Wails build rather than as a sentence naming the cause.
      - name: Verify OpenCV is the version gocv expects
        run: |
          installed_version="$(pkg-config --modversion opencv4)"
          echo "OpenCV: ${installed_version}"
          if [ "${installed_version}" != "${OPENCV_VERSION}" ]; then
            echo "::error::Expected OpenCV ${OPENCV_VERSION} to match gocv v0.31.0, got ${installed_version}."
            echo "gocv v0.31.0 does not compile against newer OpenCV: the aruco C++ API changed"
            echo "and the build fails with \"expected primary-expression before 'bool'\"."
            exit 1
          fi

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # matrix.architecture is spelled the same way by all three consumers it
      # feeds: Wails' -platform suffix, dpkg's Architecture field, and the
      # asset filenames. That is why one matrix key is enough and no lookup
      # table is needed.
      - name: Build
        run: |
          # -tags webkit2_41 is mandatory on Ubuntu 24.04; see the Makefile.
          wails build -tags webkit2_41 -clean -platform linux/${{ matrix.architecture }}
          # After the desktop build, never before: -clean empties build/bin and
          # would delete a CLI built first, so the tarball copy would fail.
          go build -o build/bin/spareeye-cli ./cmd/spareeye-cli

      # A successful link does not prove the binary can load libopencv at
      # runtime. -list-cameras exits 0 on a machine with no webcam.
      - name: Smoke test the CLI
        run: ./build/bin/spareeye-cli -list-cameras

      - name: Fail if a credential reached the bundle
        run: ./scripts/check-no-credentials.sh build/bin

      - name: Package tarball
        id: package
        run: |
          version="${GITHUB_REF_NAME}"
          staging_directory="spareeye-${version}-linux-${{ matrix.architecture }}"
          mkdir -p "${staging_directory}"

          # Copy explicitly, never `cp -r build/bin/.`, so that nothing which
          # happens to be sitting in the output directory can be swept into a
          # published archive.
          cp build/bin/spareeye "${staging_directory}/"
          cp README.md LICENSE "${staging_directory}/"
          cp build/linux/spareeye.desktop "${staging_directory}/"
          cp build/linux/spareeye.metainfo.xml "${staging_directory}/"
          cp build/appicon.png "${staging_directory}/"
          cp build/linux/install.sh "${staging_directory}/"
          chmod +x "${staging_directory}/install.sh"

          tar -czf "${staging_directory}.tar.gz" "${staging_directory}"
          sha256sum "${staging_directory}.tar.gz" > "${staging_directory}.tar.gz.sha256"
          echo "tarball=${staging_directory}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Verify the tarball contains no credentials
        run: |
          extract_directory="$(mktemp -d)"
          tar -xzf "${{ steps.package.outputs.tarball }}" -C "${extract_directory}"
          ./scripts/check-no-credentials.sh "${extract_directory}"

      # The tarball leaves the user to discover the runtime libraries when the
      # app refuses to start. A .deb states them, so apt installs them. Built
      # with dpkg-deb and a control file written out in full here, because the
      # whole package is small enough to read in one screen and a packaging
      # helper would spread it across a debian/ tree instead.
      - name: Build the .deb package
        id: package-deb
        run: |
          # A Debian version cannot carry the tag's leading "v", and on a
          # workflow_dispatch dry run GITHUB_REF_NAME is a branch name, which is
          # not a valid Debian version at all. Anything that is not a tag gets a
          # placeholder instead; "~" sorts below everything, so a package built
          # from a branch can never appear newer than a real release.
          version="${GITHUB_REF_NAME}"
          if [[ "${version}" =~ ^v[0-9] ]]; then
            debian_version="${version#v}"
          else
            debian_version="0.0.0~dryrun"
          fi

          debian_architecture="${{ matrix.architecture }}"
          package_root="spareeye_${debian_version}_${debian_architecture}"

          # install -d rather than mkdir -p: the runner's umask is not
          # guaranteed, and a directory shipped 0775 is a lintian warning.
          install -d -m 0755 "${package_root}/DEBIAN"
          install -d -m 0755 "${package_root}/usr/bin"
          install -d -m 0755 "${package_root}/usr/share/applications"
          install -d -m 0755 "${package_root}/usr/share/metainfo"
          install -d -m 0755 "${package_root}/usr/share/icons/hicolor/512x512/apps"
          install -d -m 0755 "${package_root}/usr/share/doc/spareeye"

          # Only the desktop binary. The headless CLI is deliberately absent
          # from every bundle, and /usr/bin is the last place it should turn up.
          install -m 0755 build/bin/spareeye "${package_root}/usr/bin/spareeye"
          install -m 0644 build/linux/spareeye.desktop \
            "${package_root}/usr/share/applications/spareeye.desktop"
          install -m 0644 build/linux/spareeye.metainfo.xml \
            "${package_root}/usr/share/metainfo/spareeye.metainfo.xml"

          # build/appicon.png is 1024x1024, but hicolor's index.theme stops at
          # 512x512, so an icon filed under 1024x1024 is never looked up and the
          # desktop entry's Icon=spareeye resolves to nothing. Resample to the
          # largest size the theme actually indexes.
          icon_path="${package_root}/usr/share/icons/hicolor/512x512/apps/spareeye.png"
          convert build/appicon.png -resize 512x512 "${icon_path}"
          chmod 0644 "${icon_path}"

          # These three files are written by heredoc. A YAML block scalar
          # forces their contents to be indented along with the shell, so each
          # one is piped through sed to take that indentation back off again.
          strip_indent() { sed 's/^          //'; }

          strip_indent > "${package_root}/usr/share/doc/spareeye/copyright" <<'COPYRIGHT'
          Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/
          Upstream-Name: SpareEye
          Source: https://github.com/issar13/spareeye

          Files: *
          Copyright: 2025 Issa Suleiman
          License: MIT

          License: MIT
           Permission is hereby granted, free of charge, to any person obtaining a copy
           of this software and associated documentation files (the "Software"), to deal
           in the Software without restriction, including without limitation the rights
           to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
           copies of the Software, and to permit persons to whom the Software is
           furnished to do so, subject to the following conditions:
           .
           The above copyright notice and this permission notice shall be included in all
           copies or substantial portions of the Software.
           .
           THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
           IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
           FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
           AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
           LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
           OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
           SOFTWARE.
          COPYRIGHT
          chmod 0644 "${package_root}/usr/share/doc/spareeye/copyright"

          # Debian treats a package with no changelog as an error, not a nicety.
          # One entry pointing at the release page is honest: the real notes are
          # generated on GitHub and duplicating them here would let them drift.
          strip_indent > "${package_root}/usr/share/doc/spareeye/changelog" <<CHANGELOG
          spareeye (${debian_version}) unstable; urgency=medium

            * Release ${debian_version}. Notes:
              https://github.com/issar13/spareeye/releases

           -- Issa Suleiman <suleimani@pgls.com>  $(date -R -u)
          CHANGELOG
          gzip -9n "${package_root}/usr/share/doc/spareeye/changelog"
          chmod 0644 "${package_root}/usr/share/doc/spareeye/changelog.gz"

          # The dependencies are read out of the binary rather than written by
          # hand. The job installs -dev packages to compile against; what the
          # user needs at run time is the library packages those pull in, and
          # dpkg-shlibdeps is what knows the difference. It insists on a
          # debian/control in the working directory even with -O, so it gets a
          # stub; the repository has no debian/ directory of its own.
          install -d debian
          printf 'Source: spareeye\n\nPackage: spareeye\nArchitecture: %s\n' "${debian_architecture}" > debian/control
          shlibs_line="$(dpkg-shlibdeps -O "${package_root}/usr/bin/spareeye")"
          rm -rf debian
          runtime_depends="${shlibs_line#shlibs:Depends=}"
          echo "Derived runtime dependencies: ${runtime_depends}"

          installed_size="$(du -k -s --exclude=DEBIAN "${package_root}" | cut -f1)"

          # Section video: the application's whole job is capturing and
          # recording from a camera. utils would be true of anything.
          #
          # No postinst or prerm. dpkg triggers in desktop-file-utils and
          # hicolor-icon-theme rebuild the desktop database and the icon cache
          # when files land in those directories, and a hand-rolled script would
          # only do the same work less reliably.
          strip_indent > "${package_root}/DEBIAN/control" <<CONTROL
          Package: spareeye
          Version: ${debian_version}
          Section: video
          Priority: optional
          Architecture: ${debian_architecture}
          Depends: ${runtime_depends}
          Installed-Size: ${installed_size}
          Maintainer: Issa Suleiman <suleimani@pgls.com>
          Homepage: https://github.com/issar13/spareeye
          Description: Turn a spare laptop into a home security camera
           SpareEye watches a webcam for movement and sends a snapshot and a short
           video clip to a Telegram chat when it sees any. Sensitivity, recording
           length and a separate night-time profile are configurable from the
           application itself.
           .
           Recordings are kept locally under the per-user configuration directory
           and pruned on a retention schedule. Alert footage is uploaded to
           Telegram's servers, so consider who might appear in view of the camera.
           .
           Every installation talks to a Telegram bot you create yourself; there is
           no shared bot and no token in the binary.
          CONTROL
          chmod 0644 "${package_root}/DEBIAN/control"

          # --root-owner-group, or every file in the package is owned by the
          # runner's own uid instead of root.
          dpkg-deb --root-owner-group --build "${package_root}"

          deb_file="${package_root}.deb"
          sha256sum "${deb_file}" > "${deb_file}.sha256"
          echo "deb=${deb_file}" >> "$GITHUB_OUTPUT"

      # Printed in full so the log is a record of exactly what shipped, and
      # linted so that a packaging mistake fails the release rather than
      # reaching users. Warnings are allowed through: the Go binary is not
      # built PIE and a GUI app has no man page, and neither is worth blocking
      # a release over. Errors are not.
      - name: Inspect and lint the .deb
        run: |
          dpkg-deb --info "${{ steps.package-deb.outputs.deb }}"
          dpkg-deb --contents "${{ steps.package-deb.outputs.deb }}"
          lintian --fail-on error "${{ steps.package-deb.outputs.deb }}"

      # Do this in a pristine Ubuntu image, not on the runner. The runner still
      # has every development package used by the build, so a missing Depends
      # entry could otherwise be hidden by a library that was already present.
      # Installing in a clean image proves that the package metadata alone is
      # sufficient to produce a runnable filesystem.
      - name: Install and smoke test the .deb
        run: |
          deb_file="${{ steps.package-deb.outputs.deb }}"
          docker run --rm \
            --volume "${PWD}:/release:ro" \
            --env EXPECTED_ARCHITECTURE="${{ matrix.architecture }}" \
            --env DEB_FILE="${deb_file}" \
            ubuntu:24.04 \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install --no-install-recommends -y "/release/${DEB_FILE}"

              test "$(dpkg-query -W -f="\${binary:Package}\n" spareeye)" = "spareeye"
              test "$(dpkg-query -W -f="\${db:Status-Status}\n" spareeye)" = "installed"
              test "$(dpkg-query -W -f="\${Architecture}\n" spareeye)" = "${EXPECTED_ARCHITECTURE}"
              dpkg --verify spareeye

              if ldd /usr/bin/spareeye | grep -F "not found"; then
                echo "The installed application has unresolved shared libraries." >&2
                exit 1
              fi
            '

      - name: Verify the .deb contains no credentials
        run: |
          extract_directory="$(mktemp -d)"
          dpkg-deb -x "${{ steps.package-deb.outputs.deb }}" "${extract_directory}"
          ./scripts/check-no-credentials.sh "${extract_directory}"

      # The artifact name carries the architecture because upload-artifact@v4
      # refuses a second upload under a name that already exists, and both
      # matrix jobs upload at roughly the same moment. The publish job
      # downloads with merge-multiple, which flattens every artifact's contents
      # into release-assets rather than into a directory per artifact, so the
      # names here never appear in the published asset list.
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.architecture }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.deb
            *.deb.sha256
          if-no-files-found: error

  windows:
    name: Build Windows
    needs: credential-scan
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          # Node 20 reached end of life in April 2026. 24 is the current LTS and
          # is what development machines run, so CI and a developer build the
          # same frontend with the same toolchain.
          node-version: '24'

      # Restore/save pairs, not actions/cache: its save runs in a post step
      # guarded by success(), so any later failure discards the OpenCV build
      # and the next attempt pays the full forty minutes again. Each save runs
      # right after the step that produces its content instead.
      - name: Cache OpenCV source
        id: cache-opencv-source
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}\opencv\opencv-${{ env.OPENCV_VERSION }}
            ${{ github.workspace }}\opencv\opencv_contrib-${{ env.OPENCV_VERSION }}
          key: opencv-source-${{ env.OPENCV_VERSION }}-windows-v2

      - name: Download OpenCV source
        if: steps.cache-opencv-source.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $openCvRoot = "${env:GITHUB_WORKSPACE}\opencv"
          New-Item -ItemType Directory -Force -Path $openCvRoot | Out-Null
          foreach ($repository in @('opencv', 'opencv_contrib')) {
            $archivePath = "$openCvRoot\$repository.zip"
            Invoke-WebRequest -Uri "https://github.com/opencv/$repository/archive/${env:OPENCV_VERSION}.zip" -OutFile $archivePath
            Expand-Archive -Path $archivePath -DestinationPath $openCvRoot -Force
            Remove-Item $archivePath
          }

      - name: Save the OpenCV source cache
        if: steps.cache-opencv-source.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}\opencv\opencv-${{ env.OPENCV_VERSION }}
            ${{ github.workspace }}\opencv\opencv_contrib-${{ env.OPENCV_VERSION }}
          key: opencv-source-${{ env.OPENCV_VERSION }}-windows-v2

      # Shares a cache key with ci.yml on purpose: a release tag pushed after a
      # green CI run reuses that build and finishes in minutes instead of hours.
      - name: Cache OpenCV build
        id: cache-opencv-build
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\opencv\build
          key: opencv-build-${{ env.OPENCV_VERSION }}-windows-v2

      - name: Build OpenCV with MinGW
        if: steps.cache-opencv-build.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cmake "%GITHUB_WORKSPACE%\opencv\opencv-%OPENCV_VERSION%" ^
            -G "MinGW Makefiles" ^
            -B"%GITHUB_WORKSPACE%\opencv\build" ^
            -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\opencv\build\install" ^
            -DOPENCV_EXTRA_MODULES_PATH="%GITHUB_WORKSPACE%\opencv\opencv_contrib-%OPENCV_VERSION%\modules" ^
            -DENABLE_CXX11=ON -DBUILD_SHARED_LIBS=ON -DOPENCV_ENABLE_NONFREE=ON ^
            -DBUILD_LIST=core,imgproc,imgcodecs,videoio,highgui,video,calib3d,features2d,objdetect,dnn,photo,face,xfeatures2d,plot,tracking,img_hash,bgsegm,aruco,wechat_qrcode,ximgproc ^
            -DBUILD_opencv_gapi=OFF -DWITH_IPP=OFF -DWITH_MSMF=OFF ^
            -DWITH_OPENCL_D3D11_NV=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF ^
            -DBUILD_PERF_TESTS=OFF -DBUILD_DOCS=OFF -DBUILD_opencv_java=OFF ^
            -DBUILD_opencv_python=OFF -DBUILD_opencv_python2=OFF ^
            -DBUILD_opencv_python3=OFF -DBUILD_opencv_saliency=OFF ^
            -DBUILD_opencv_wechat_qrcode=ON -DENABLE_PRECOMPILED_HEADERS=OFF ^
            -DCPU_DISPATCH= -DOPENCV_GENERATE_PKGCONFIG=ON ^
            -DOPENCV_ALLOCATOR_STATS_COUNTER_TYPE=int64_t -Wno-dev
          if errorlevel 1 exit /b 1
          cd "%GITHUB_WORKSPACE%\opencv\build"
          mingw32-make -j%NUMBER_OF_PROCESSORS%
          if errorlevel 1 exit /b 1
          mingw32-make install

      - name: Save the OpenCV build cache
        if: steps.cache-opencv-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\opencv\build
          key: opencv-build-${{ env.OPENCV_VERSION }}-windows-v2

      - name: Point cgo at the OpenCV install
        shell: pwsh
        run: |
          $installRoot = "${env:GITHUB_WORKSPACE}\opencv\build\install"
          $openCvLibraries = @(
            'core', 'face', 'videoio', 'imgproc', 'highgui', 'imgcodecs',
            'objdetect', 'features2d', 'video', 'dnn', 'xfeatures2d', 'plot',
            'tracking', 'img_hash', 'calib3d', 'bgsegm', 'photo', 'aruco',
            'wechat_qrcode', 'ximgproc'
          ) | ForEach-Object { "-lopencv_${_}460" }
          "CGO_CXXFLAGS=--std=c++11 -DNDEBUG" >> $env:GITHUB_ENV
          "CGO_CPPFLAGS=-I$installRoot\include" >> $env:GITHUB_ENV
          "CGO_LDFLAGS=-L$installRoot\x64\mingw\lib $($openCvLibraries -join ' ')" >> $env:GITHUB_ENV
          "$installRoot\x64\mingw\bin" >> $env:GITHUB_PATH

      - name: Install NSIS
        # `wails build -nsis` shells out to makensis; it is not on the runner
        # image by default.
        run: choco install nsis -y --no-progress

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # Three phases, because the NSIS step packages whatever is in build\bin
      # at the moment it runs, and -clean empties that directory first.
      - name: Build the app
        run: wails build -tags customenv -clean -platform windows/amd64

      - name: Build CLI
        run: go build -tags customenv -o build\bin\spareeye-cli.exe .\cmd\spareeye-cli

      # OpenCV is built with BUILD_SHARED_LIBS=ON, so neither binary starts
      # without libopencv_*460.dll beside it, and the MinGW runtime is needed
      # because OpenCV is compiled with g++ rather than MSVC. Staged before the
      # installer is generated so project.nsi can bundle them.
      - name: Stage the runtime DLLs
        shell: pwsh
        run: |
          $openCvBin = "${env:GITHUB_WORKSPACE}\opencv\build\install\x64\mingw\bin"
          Copy-Item "$openCvBin\*.dll" -Destination build\bin -Force

          foreach ($runtime in @('libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll')) {
            $found = Get-Command $runtime -ErrorAction SilentlyContinue
            if ($found) {
              Copy-Item $found.Source -Destination build\bin -Force
            } else {
              Write-Host "::warning::$runtime not found on PATH; the binaries may not start on a clean machine."
            }
          }

      - name: Smoke test the CLI
        run: .\build\bin\spareeye-cli.exe -list-cameras

      # Signing is optional and absent by default: these builds ship unsigned.
      # Add the two secrets and every asset is signed with no further change.
      # WINDOWS_CERTIFICATE_BASE64 is a .pfx encoded with
      #   certutil -encode cert.pfx cert.txt
      # and WINDOWS_CERTIFICATE_PASSWORD is its password.
      #
      # The timestamp is not optional when signing: without /tr the signature
      # stops verifying the day the certificate expires, and everything already
      # downloaded starts warning again.
      - name: Sign the binaries
        if: env.CERTIFICATE != ''
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
          try {
            $binary = 'build\bin\spareeye.exe'
            & signtool sign /f $pfx /p $env:CERTIFICATE_PASSWORD `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 $binary
            if ($LASTEXITCODE -ne 0) { throw "signing $binary failed" }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Note that the binaries are unsigned
        if: env.CERTIFICATE == ''
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: echo "::notice::No signing certificate configured. Windows will report an unknown publisher and SmartScreen will warn on first run."

      # No -clean here: the DLLs staged above have to survive into the bundle.
      - name: Build installer
        run: wails build -tags customenv -platform windows/amd64 -nsis

      # The installer is a separate executable and needs its own signature; the
      # signatures on the binaries inside it do not cover the wrapper the user
      # actually double-clicks.
      - name: Sign the installer
        if: env.CERTIFICATE != ''
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
          try {
            $installer = Get-ChildItem -Path build\bin -Filter '*-installer.exe' -Recurse | Select-Object -First 1
            & signtool sign /f $pfx /p $env:CERTIFICATE_PASSWORD `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw 'signing the installer failed' }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Fail if a credential reached the bundle
        shell: bash
        run: ./scripts/check-no-credentials.sh build/bin

      - name: Stage installer
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          # Wails names the installer from build/windows/installer/*.nsi and
          # the product version; glob rather than guess.
          $installer = Get-ChildItem -Path build\bin -Filter '*-installer.exe' -Recurse | Select-Object -First 1
          if (-not $installer) {
            Write-Error 'No NSIS installer was produced in build\bin.'
            exit 1
          }
          Copy-Item $installer.FullName "staging\spareeye-$version-windows-amd64-installer.exe"
          # The headless CLI is deliberately not published on its own. The
          # installer already places it beside the desktop app with the DLLs it
          # needs, so a separate download would be the same files a second time
          # under a name that means nothing to somebody who wants a camera.
          # The list is materialised with @() before the loop writes anything.
          # A streaming Get-ChildItem would hand the loop the .sha256 files it
          # is itself creating, and they would get checksums of their own.
          foreach ($asset in @(Get-ChildItem staging -File)) {
            $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($asset.Name)" | Out-File -FilePath "$($asset.FullName).sha256" -Encoding ascii
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: staging/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux, windows]
    # workflow_dispatch runs are dry runs: they build and upload artifacts but
    # must not create a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release and upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      # Computed here rather than written into the notes by hand, so the version
      # and date on the release page cannot disagree with the artifacts beside
      # them. A 0.x tag is marked pre-release: the version is the claim about
      # stability, and the release page should not contradict it.
      - name: Describe this build
        id: describe
        run: |
          version="${GITHUB_REF_NAME}"
          {
            echo "version=${version}"
            echo "built=$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "commit=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

          if [[ "${version}" =~ ^v0\. ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.describe.outputs.prerelease }}
          body: |
            Turn a spare laptop into a home security camera. Arm it, and it
            watches the room through the built-in webcam and messages you on
            Telegram when something moves.

            ## Downloads

            | Platform | Architecture | Download | How to install |
            |---|---|---|---|
            | Windows 10/11 | x64 (Intel/AMD) | `spareeye-*-windows-amd64-installer.exe` | Run it and follow the wizard. Installs for your user only, so it never asks for administrator rights |
            | Debian / Ubuntu | x64 (amd64) | `spareeye_*_amd64.deb` | `sudo apt install ./spareeye_*_amd64.deb`. Use apt rather than `dpkg -i`: apt pulls in OpenCV and WebKit for you, `dpkg` only complains that they are missing |
            | Debian / Ubuntu | ARM64 (aarch64) | `spareeye_*_arm64.deb` | Same command with the arm64 file. This is the one for a Raspberry Pi 4 or 5 running 64-bit Raspberry Pi OS, or any other arm64 Debian derivative |
            | Other Linux | x64 (amd64) | `spareeye-*-linux-amd64.tar.gz` | Extract, then `./install.sh` |
            | Other Linux | ARM64 (aarch64) | `spareeye-*-linux-arm64.tar.gz` | Extract, then `./install.sh` |

            Linux is published for x64 and ARM64. Windows is x64 only, and
            macOS is not published at all. The app links OpenCV through cgo, so
            every architecture needs a build machine of its own rather than a
            cross-compile, and only the two Linux ones are available to this
            project. If your machine is 32-bit ARM, or 64-bit hardware running
            a 32-bit userland as some older Raspberry Pi OS images do, neither
            Linux download will run; check with `dpkg --print-architecture`.

            ## Requirements

            | | |
            |---|---|
            | Windows | 10 or later. The installer bundles OpenCV, so nothing else is needed |
            | Linux | GTK 3.24+, WebKit2GTK 4.1+, and OpenCV 4.6. The `.deb` declares all of these, so apt installs them; with the tarball, `sudo apt install libopencv-dev` on Ubuntu 24.04 |
            | Camera | Any webcam not already in use by another program |
            | Telegram | Your own bot. There is no shared bot and no token in the binary |

            ## First run

            1. Create your bot with @BotFather and note the token and your chat
               ID. The Setup screen walks you through it.
            2. Pick your camera. Do not assume the first one: a virtual camera
               such as Iriun or OBS often takes index 0 and delivers no frames.
            3. Press **Start watching**.

            ## Before you point it at a room

            When an alert fires, the snapshot and clip are uploaded to
            Telegram's servers. If other people use the space you are
            recording, their footage leaves your machine too, and they have not
            agreed to that. Depending on where you live, recording people
            without telling them may be illegal regardless of whose home it is.

            Anyone who obtains your bot token can receive your footage and
            command your camera. Treat it like a password.

            ## The unsigned-binary warning

            These builds are **not code-signed**. On first run SmartScreen shows
            "Windows protected your PC". Choose *More info*, then *Run anyway*.
            The installer requests no administrator rights, so there is no
            separate red "Unknown publisher" elevation prompt.

            This is not a verdict on the file. SmartScreen is about reputation,
            and a binary nobody has downloaded yet has none. Verify the
            `.sha256` if you want certainty about what you received.

            Every asset ships with a `.sha256` file. Check your download against
            it before running it.

            ## This build

            | | |
            |---|---|
            | Version | ${{ steps.describe.outputs.version }} |
            | Built | ${{ steps.describe.outputs.built }} |
            | Commit | `${{ steps.describe.outputs.commit }}` |
            | Platforms | Windows x64, Linux x64, Linux ARM64 |
            | OpenCV | 4.6.0, bundled on Windows, from your distribution on Linux |
