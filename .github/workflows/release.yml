name: Release

# Tagged builds. Same native-runner constraint as ci.yml: gocv needs cgo, so
# each artifact is built on its own platform. macOS is out of scope.
#
# Binaries ship UNSIGNED. Windows users will see a SmartScreen warning on
# first run; the release notes say so explicitly rather than letting people
# discover it.

on:
  push:
    tags:
      - 'v*'
  # Allows a dry run against a branch: builds and uploads artifacts but
  # publishes no release.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never interrupt a half-finished release build

permissions:
  contents: read

env:
  OPENCV_VERSION: 4.6.0
  WAILS_VERSION: v2.13.0

jobs:
  # A leaked credential must stop a release before any artifact is published.
  # Once a release asset is public it cannot be unpublished meaningfully.
  credential-scan:
    name: Credential scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/check-no-credentials.sh

  linux:
    name: Build Linux
    needs: credential-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenCV and GTK/WebKit development packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libopencv-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        run: |
          # -tags webkit2_41 is mandatory on Ubuntu 24.04; see the Makefile.
          wails build -tags webkit2_41 -clean -platform linux/amd64
          # After the desktop build, never before: -clean empties build/bin and
          # would delete a CLI built first, so the tarball copy would fail.
          go build -o build/bin/kaa-rada-cli ./cmd/kaa-rada-cli

      # A successful link does not prove the binary can load libopencv at
      # runtime. -list-cameras exits 0 on a machine with no webcam.
      - name: Smoke test the CLI
        run: ./build/bin/kaa-rada-cli -list-cameras

      - name: Fail if a credential reached the bundle
        run: ./scripts/check-no-credentials.sh build/bin

      - name: Package tarball
        id: package
        run: |
          version="${GITHUB_REF_NAME}"
          staging_directory="kaa-rada-${version}-linux-amd64"
          mkdir -p "${staging_directory}"

          # Copy explicitly, never `cp -r build/bin/.`, so that nothing which
          # happens to be sitting in the output directory can be swept into a
          # published archive.
          cp build/bin/kaa-rada "${staging_directory}/"
          cp build/bin/kaa-rada-cli "${staging_directory}/"
          cp README.md LICENSE "${staging_directory}/"
          cp build/linux/kaa-rada.desktop "${staging_directory}/"
          cp build/linux/kaa-rada.metainfo.xml "${staging_directory}/"
          cp build/appicon.png "${staging_directory}/"
          cp build/linux/install.sh "${staging_directory}/"
          chmod +x "${staging_directory}/install.sh"

          tar -czf "${staging_directory}.tar.gz" "${staging_directory}"
          sha256sum "${staging_directory}.tar.gz" > "${staging_directory}.tar.gz.sha256"
          echo "tarball=${staging_directory}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Verify the tarball contains no credentials
        run: |
          extract_directory="$(mktemp -d)"
          tar -xzf "${{ steps.package.outputs.tarball }}" -C "${extract_directory}"
          ./scripts/check-no-credentials.sh "${extract_directory}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error

  windows:
    name: Build Windows
    needs: credential-scan
    runs-on: windows-2022
    # UNVALIDATED, exactly as in ci.yml. This has never been run. Expect the
    # first tagged release to need a retry or two on this job.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Restore/save pairs, not actions/cache: its save runs in a post step
      # guarded by success(), so any later failure discards the OpenCV build
      # and the next attempt pays the full forty minutes again. Each save runs
      # right after the step that produces its content instead.
      - name: Cache OpenCV source
        id: cache-opencv-source
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}\opencv\opencv-${{ env.OPENCV_VERSION }}
            ${{ github.workspace }}\opencv\opencv_contrib-${{ env.OPENCV_VERSION }}
          key: opencv-source-${{ env.OPENCV_VERSION }}-windows-v2

      - name: Download OpenCV source
        if: steps.cache-opencv-source.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $openCvRoot = "${env:GITHUB_WORKSPACE}\opencv"
          New-Item -ItemType Directory -Force -Path $openCvRoot | Out-Null
          foreach ($repository in @('opencv', 'opencv_contrib')) {
            $archivePath = "$openCvRoot\$repository.zip"
            Invoke-WebRequest -Uri "https://github.com/opencv/$repository/archive/${env:OPENCV_VERSION}.zip" -OutFile $archivePath
            Expand-Archive -Path $archivePath -DestinationPath $openCvRoot -Force
            Remove-Item $archivePath
          }

      - name: Save the OpenCV source cache
        if: steps.cache-opencv-source.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}\opencv\opencv-${{ env.OPENCV_VERSION }}
            ${{ github.workspace }}\opencv\opencv_contrib-${{ env.OPENCV_VERSION }}
          key: opencv-source-${{ env.OPENCV_VERSION }}-windows-v2

      # Shares a cache key with ci.yml on purpose: a release tag pushed after a
      # green CI run reuses that build and finishes in minutes instead of hours.
      - name: Cache OpenCV build
        id: cache-opencv-build
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\opencv\build
          key: opencv-build-${{ env.OPENCV_VERSION }}-windows-v2

      - name: Build OpenCV with MinGW
        if: steps.cache-opencv-build.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cmake "%GITHUB_WORKSPACE%\opencv\opencv-%OPENCV_VERSION%" ^
            -G "MinGW Makefiles" ^
            -B"%GITHUB_WORKSPACE%\opencv\build" ^
            -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\opencv\build\install" ^
            -DOPENCV_EXTRA_MODULES_PATH="%GITHUB_WORKSPACE%\opencv\opencv_contrib-%OPENCV_VERSION%\modules" ^
            -DENABLE_CXX11=ON -DBUILD_SHARED_LIBS=ON -DOPENCV_ENABLE_NONFREE=ON ^
            -DBUILD_LIST=core,imgproc,imgcodecs,videoio,highgui,video,calib3d,features2d,objdetect,dnn,photo,face,xfeatures2d,plot,tracking,img_hash,bgsegm,aruco,wechat_qrcode,ximgproc ^
            -DBUILD_opencv_gapi=OFF -DWITH_IPP=OFF -DWITH_MSMF=OFF ^
            -DWITH_OPENCL_D3D11_NV=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF ^
            -DBUILD_PERF_TESTS=OFF -DBUILD_DOCS=OFF -DBUILD_opencv_java=OFF ^
            -DBUILD_opencv_python=OFF -DBUILD_opencv_python2=OFF ^
            -DBUILD_opencv_python3=OFF -DBUILD_opencv_saliency=OFF ^
            -DBUILD_opencv_wechat_qrcode=ON -DENABLE_PRECOMPILED_HEADERS=OFF ^
            -DCPU_DISPATCH= -DOPENCV_GENERATE_PKGCONFIG=ON ^
            -DOPENCV_ALLOCATOR_STATS_COUNTER_TYPE=int64_t -Wno-dev
          if errorlevel 1 exit /b 1
          cd "%GITHUB_WORKSPACE%\opencv\build"
          mingw32-make -j%NUMBER_OF_PROCESSORS%
          if errorlevel 1 exit /b 1
          mingw32-make install

      - name: Save the OpenCV build cache
        if: steps.cache-opencv-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\opencv\build
          key: opencv-build-${{ env.OPENCV_VERSION }}-windows-v2

      - name: Point cgo at the OpenCV install
        shell: pwsh
        run: |
          $installRoot = "${env:GITHUB_WORKSPACE}\opencv\build\install"
          $openCvLibraries = @(
            'core', 'face', 'videoio', 'imgproc', 'highgui', 'imgcodecs',
            'objdetect', 'features2d', 'video', 'dnn', 'xfeatures2d', 'plot',
            'tracking', 'img_hash', 'calib3d', 'bgsegm', 'photo', 'aruco',
            'wechat_qrcode', 'ximgproc'
          ) | ForEach-Object { "-lopencv_${_}460" }
          "CGO_CXXFLAGS=--std=c++11 -DNDEBUG" >> $env:GITHUB_ENV
          "CGO_CPPFLAGS=-I$installRoot\include" >> $env:GITHUB_ENV
          "CGO_LDFLAGS=-L$installRoot\x64\mingw\lib $($openCvLibraries -join ' ')" >> $env:GITHUB_ENV
          "$installRoot\x64\mingw\bin" >> $env:GITHUB_PATH

      - name: Install NSIS
        # `wails build -nsis` shells out to makensis; it is not on the runner
        # image by default.
        run: choco install nsis -y --no-progress

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # Three phases, because the NSIS step packages whatever is in build\bin
      # at the moment it runs, and -clean empties that directory first.
      - name: Build the app
        run: wails build -tags customenv -clean -platform windows/amd64

      - name: Build CLI
        run: go build -tags customenv -o build\bin\kaa-rada-cli.exe .\cmd\kaa-rada-cli

      # OpenCV is built with BUILD_SHARED_LIBS=ON, so neither binary starts
      # without libopencv_*460.dll beside it, and the MinGW runtime is needed
      # because OpenCV is compiled with g++ rather than MSVC. Staged before the
      # installer is generated so project.nsi can bundle them.
      - name: Stage the runtime DLLs
        shell: pwsh
        run: |
          $openCvBin = "${env:GITHUB_WORKSPACE}\opencv\build\install\x64\mingw\bin"
          Copy-Item "$openCvBin\*.dll" -Destination build\bin -Force

          foreach ($runtime in @('libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll')) {
            $found = Get-Command $runtime -ErrorAction SilentlyContinue
            if ($found) {
              Copy-Item $found.Source -Destination build\bin -Force
            } else {
              Write-Host "::warning::$runtime not found on PATH; the binaries may not start on a clean machine."
            }
          }

      - name: Smoke test the CLI
        run: .\build\bin\kaa-rada-cli.exe -list-cameras

      # Signing is optional and absent by default: these builds ship unsigned.
      # Add the two secrets and every asset is signed with no further change.
      # WINDOWS_CERTIFICATE_BASE64 is a .pfx encoded with
      #   certutil -encode cert.pfx cert.txt
      # and WINDOWS_CERTIFICATE_PASSWORD is its password.
      #
      # The timestamp is not optional when signing: without /tr the signature
      # stops verifying the day the certificate expires, and everything already
      # downloaded starts warning again.
      - name: Sign the binaries
        if: env.CERTIFICATE != ''
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
          try {
            foreach ($binary in @('build\bin\kaa-rada.exe', 'build\bin\kaa-rada-cli.exe')) {
              & signtool sign /f $pfx /p $env:CERTIFICATE_PASSWORD `
                /tr http://timestamp.digicert.com /td sha256 /fd sha256 $binary
              if ($LASTEXITCODE -ne 0) { throw "signing $binary failed" }
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Note that the binaries are unsigned
        if: env.CERTIFICATE == ''
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: echo "::notice::No signing certificate configured. Windows will report an unknown publisher and SmartScreen will warn on first run."

      # No -clean here: the DLLs staged above have to survive into the bundle.
      - name: Build installer
        run: wails build -tags customenv -platform windows/amd64 -nsis

      # The installer is a separate executable and needs its own signature; the
      # signatures on the binaries inside it do not cover the wrapper the user
      # actually double-clicks.
      - name: Sign the installer
        if: env.CERTIFICATE != ''
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
          try {
            $installer = Get-ChildItem -Path build\bin -Filter '*-installer.exe' -Recurse | Select-Object -First 1
            & signtool sign /f $pfx /p $env:CERTIFICATE_PASSWORD `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw 'signing the installer failed' }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Fail if a credential reached the bundle
        shell: bash
        run: ./scripts/check-no-credentials.sh build/bin

      - name: Stage installer
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          # Wails names the installer from build/windows/installer/*.nsi and
          # the product version; glob rather than guess.
          $installer = Get-ChildItem -Path build\bin -Filter '*-installer.exe' -Recurse | Select-Object -First 1
          if (-not $installer) {
            Write-Error 'No NSIS installer was produced in build\bin.'
            exit 1
          }
          Copy-Item $installer.FullName "staging\kaa-rada-$version-windows-amd64-installer.exe"
          # The headless CLI is deliberately not published on its own. The
          # installer already places it beside the desktop app with the DLLs it
          # needs, so a separate download would be the same files a second time
          # under a name that means nothing to somebody who wants a camera.
          # The list is materialised with @() before the loop writes anything.
          # A streaming Get-ChildItem would hand the loop the .sha256 files it
          # is itself creating, and they would get checksums of their own.
          foreach ($asset in @(Get-ChildItem staging -File)) {
            $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($asset.Name)" | Out-File -FilePath "$($asset.FullName).sha256" -Encoding ascii
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: staging/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux, windows]
    # workflow_dispatch runs are dry runs: they build and upload artifacts but
    # must not create a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release and upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      # Computed here rather than written into the notes by hand, so the version
      # and date on the release page cannot disagree with the artifacts beside
      # them. A 0.x tag is marked pre-release: the version is the claim about
      # stability, and the release page should not contradict it.
      - name: Describe this build
        id: describe
        run: |
          version="${GITHUB_REF_NAME}"
          {
            echo "version=${version}"
            echo "built=$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "commit=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

          if [[ "${version}" =~ ^v0\. ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.describe.outputs.prerelease }}
          body: |
            Turn a spare laptop into a home security camera. Arm it, and it
            watches the room through the built-in webcam and messages you on
            Telegram when something moves.

            ## Downloads

            | Platform | Architecture | Download | How to install |
            |---|---|---|---|
            | Windows 10/11 | x64 (Intel/AMD) | `kaa-rada-*-windows-amd64-installer.exe` | Run it and follow the wizard. Installs for your user only, so it never asks for administrator rights |
            | Linux | x64 (amd64) | `kaa-rada-*-linux-amd64.tar.gz` | Extract, then `./install.sh` |

            Both downloads also contain `kaa-rada-cli`: the same detector with
            no window, for a machine with no display or one reached over SSH.
            Windows installs it beside the app; on Linux it is in the tarball.
            Neither needs a separate download.

            Only x64 is built. Apple Silicon and ARM Linux are not published:
            the app links OpenCV through cgo, so each architecture needs a
            native build machine rather than a cross-compile.

            ## Requirements

            | | |
            |---|---|
            | Windows | 10 or later. The installer bundles OpenCV, so nothing else is needed |
            | Linux | GTK 3.24+, WebKit2GTK 4.1+, and OpenCV 4.6 — `sudo apt install libopencv-dev` on Ubuntu 24.04 |
            | Camera | Any webcam not already in use by another program |
            | Telegram | Your own bot. There is no shared bot and no token in the binary |

            ## First run

            1. Create your bot with @BotFather and note the token and your chat
               ID — the Setup screen walks you through it.
            2. Pick your camera. Do not assume the first one: a virtual camera
               such as Iriun or OBS often takes index 0 and delivers no frames.
            3. Press **Start watching**.

            ## Before you point it at a room

            When an alert fires, the snapshot and clip are uploaded to
            Telegram's servers. If other people use the space you are
            recording, their footage leaves your machine too, and they have not
            agreed to that. Depending on where you live, recording people
            without telling them may be illegal regardless of whose home it is.

            Anyone who obtains your bot token can receive your footage and
            command your camera. Treat it like a password.

            ## The unsigned-binary warning

            These builds are **not code-signed**. On first run SmartScreen shows
            "Windows protected your PC" — choose *More info*, then *Run anyway*.
            The installer requests no administrator rights, so there is no
            separate red "Unknown publisher" elevation prompt.

            This is not a verdict on the file. SmartScreen is about reputation,
            and a binary nobody has downloaded yet has none. Verify the
            `.sha256` if you want certainty about what you received.

            Every asset ships with a `.sha256` file. Check your download against
            it before running it.

            ## This build

            | | |
            |---|---|
            | Version | ${{ steps.describe.outputs.version }} |
            | Built | ${{ steps.describe.outputs.built }} |
            | Commit | `${{ steps.describe.outputs.commit }}` |
            | Platforms | Windows x64, Linux x64 |
            | OpenCV | 4.6.0, bundled on Windows, from your distribution on Linux |
